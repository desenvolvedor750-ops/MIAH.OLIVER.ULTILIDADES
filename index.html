```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Utilidades Curiúva">

    <title>Utilidades Curiúva</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff5f8;
            color: #4a1428;
        }

        header {
            background: #7d1738;
            color: white;
            text-align: center;
            padding: 28px 15px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        header p {
            font-size: 16px;
        }

        nav {
            background: white;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        nav a {
            color: #7d1738;
            text-decoration: none;
            font-weight: bold;
            margin: 0 10px;
            line-height: 35px;
            display: inline-block;
        }

        nav a:hover {
            color: #d33b69;
        }

        .inicio {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .inicio h2 {
            color: #7d1738;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .inicio p {
            max-width: 700px;
            margin: auto;
            line-height: 1.6;
            font-size: 17px;
        }

        /* FOTO PRINCIPAL */

        .foto-container {
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        .foto-container img {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            margin: 0 auto;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.20);
        }

        .categorias {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .categorias h2 {
            text-align: center;
            color: #7d1738;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 25px 15px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .card h3 {
            color: #7d1738;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 14px;
            line-height: 1.5;
        }

        .whatsapp {
            text-align: center;
            padding: 20px 20px 50px;
        }

        .whatsapp a {
            display: inline-block;
            background: #25D366;
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 16px 25px;
            border-radius: 30px;
        }

        footer {
            background: #7d1738;
            color: white;
            text-align: center;
            padding: 20px;
            line-height: 1.6;
        }

        @media (max-width: 700px) {

            header h1 {
                font-size: 25px;
            }

            nav {
                text-align: left;
                overflow-x: auto;
                white-space: nowrap;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .foto-container {
                padding: 10px;
            }

        }

    </style>

</head>

<body>

    <header id="inicio">

        <h1>UTILIDADES CURIÚVA</h1>

        <p>Miah Oliver Studio</p>

    </header>


    <nav>

        <a href="#inicio">Início</a>
        <a href="#casa">Casa</a>
        <a href="#roupas">Roupas</a>
        <a href="#acessorios">Acessórios</a>
        <a href="#perfumes">Perfumes</a>
        <a href="#maquiagens">Maquiagens</a>
        <a href="#stanley">Stanley</a>
        <a href="#xerox">Xerox</a>
